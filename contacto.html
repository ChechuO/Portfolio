<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Home - Portfolio de Jesús Olivar Migueláñez</title>
        <meta
            name="description"
            content="Portfolio personal de Jesús Olivar Migueláñez, estudiante de desarrollo Fullstack" />
        <link rel="icon" href="https://res.cloudinary.com/pslzx5jd/image/upload/v1795026582/favicon.ico" sizes="32x32" />
        <link
            rel="icon"
            href="https://res.cloudinary.com/pslzx5jd/image/upload/v1795026582/Dragon-minimalista_blanco_ico.svg"
            type="image/svg+xml" />
        <link
            rel="apple-touch-icon"
            href="https://res.cloudinary.com/pslzx5jd/image/upload/v1795026837/apple-touch-icon.png" />
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <header id="header"></header>
        <main>
            <form action="#" method="POST">
                <fieldset>
                    <legend>Formulario de contacto</legend>
                    <div>
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required />
                    </div>

                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Email" required />
                    </div>

                    <div>
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto" placeholder="Asunto" required />
                    </div>

                    <div>
                        <label for="mensaje">Mensaje</label>
                        <div>
                            <textarea
                                id="mensaje"
                                name="mensaje"
                                cols="40"
                                rows="6"
                                placeholder="Escribe tu mensaje aquí..."
                                required></textarea>
                        </div>
                    </div>

                    <button type="submit">Enviar</button>
                    <button type="reset">Reset</button>
                </fieldset>
            </form>
        </main>
        <footer id="footer"></footer>
        <script type="module" src="./js/main.js"></script>
    </body>
</html>
